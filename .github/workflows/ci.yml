name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Enable public Nix cache
        uses: cachix/cachix-action@02b16339eddcf6ea27126a830c7f1992855cae13 # v17
        with:
          name: nix-community
          skipPush: true

      - name: Install npm dependencies
        run: nix develop --command npm ci

      - name: Run offline tests
        run: nix develop --command npm test

      - name: Evaluate flake
        run: nix flake check --no-build

      - name: Build application
        run: nix build

      - name: Build OCI image
        run: nix build .#ociImage -o result-oci

      - name: Smoke test OCI image
        run: |
          docker load < result-oci
          test "$(docker image inspect chadlands-static-collector:latest --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm chadlands-static-collector:latest --help
