name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31

      - name: Enable public Nix cache
        uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: nix-community
          skipPush: true

      - name: Run offline tests
        run: nix develop --command npm test

      - name: Evaluate flake
        run: nix flake check --no-build

      - name: Build application
        run: nix build

      - name: Build OCI image
        run: nix build .#ociImage -o result-oci

      - name: Smoke test OCI image
        run: |
          docker load < result-oci
          test "$(docker image inspect chadlands-static-collector:latest --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm chadlands-static-collector:latest --help
