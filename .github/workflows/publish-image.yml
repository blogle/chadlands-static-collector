name: Publish OCI Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Enable public Nix cache
        uses: cachix/cachix-action@02b16339eddcf6ea27126a830c7f1992855cae13 # v17
        with:
          name: nix-community
          skipPush: true

      - name: Build Nix OCI image
        run: nix build .#ociImage -o result-oci

      - name: Load Nix OCI archive
        run: docker load < result-oci

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and publish image
        id: publish
        env:
          TARGET_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          target="${TARGET_IMAGE,,}"
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-12)"
          tags=("sha-${short_sha}")

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags+=("latest")
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            tags+=("$version" "${version#v}")
          fi

          for tag in "${tags[@]}"; do
            docker tag chadlands-static-collector:latest "$target:$tag"
            docker push "$target:$tag"
          done

          echo "image=$target" >> "$GITHUB_OUTPUT"
          echo "verify_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Pull and run published image
        env:
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.image }}:${{ steps.publish.outputs.verify_tag }}
        run: |
          set -euo pipefail
          docker image rm "$PUBLISHED_IMAGE"
          docker pull "$PUBLISHED_IMAGE"
          test "$(docker image inspect "$PUBLISHED_IMAGE" --format '{{.Config.User}}')" = "10001:10001"
          mkdir -p ghcr-test-output
          chmod 0777 ghcr-test-output
          docker run --rm -v "$PWD/ghcr-test-output:/output" "$PUBLISHED_IMAGE"
